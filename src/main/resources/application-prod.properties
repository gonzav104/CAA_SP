# ===============================
# PERFIL PROD — deltas sobre application.properties
# Activar con SPRING_PROFILES_ACTIVE=prod (ver docker-compose.yml).
# ===============================

# Documentacion OpenAPI/Swagger apagada en despliegues.
# Verificado en runtime dentro del contenedor: /v3/api-docs y /swagger-ui
# dejan de servirse con el perfil prod activo.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Flag Secure de la cookie JWT: obligatorio en prod (HTTPS).
app.cookie.secure=true
