spring.application.name=CAA_SP

# ===============================
# CONFIGURACION DE BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5444/caa_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURACION DE JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ===============================
# CONFIGURACION DEL SERVIDOR
# ===============================
server.port=8080

# ===============================
# CONFIGURACION JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===============================
# CONFIGURACION CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# CONFIGURACION GOOGLE OAUTH (login con Google)
# Default vacío: dev y tests arrancan sin credenciales.
# ===============================
google.client-id=${GOOGLE_CLIENT_ID:}

# ===============================
# CONFIGURACION RESEND (emails transaccionales)
# Sin default: la app debe fallar al arrancar si falta la API key.
# ===============================
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# ===============================
# CONFIGURACION FRONTEND (links en emails)
# ===============================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# CONFIGURACION RATE LIMIT (anti fuerza bruta en login y recupero de password)
# En memoria, single-node. Clave por (operacion, email), ventana en minutos.
# ===============================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login.max=${RATE_LIMIT_LOGIN_MAX:5}
app.rate-limit.login.window-minutes=${RATE_LIMIT_LOGIN_WINDOW_MINUTES:15}
app.rate-limit.olvide-password.max=${RATE_LIMIT_OLVIDE_PASSWORD_MAX:3}
app.rate-limit.olvide-password.window-minutes=${RATE_LIMIT_OLVIDE_PASSWORD_WINDOW_MINUTES:15}
